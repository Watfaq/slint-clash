[package]
name = "slint-clash"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Clash GUI built with Slint + Material 3"
repository = "https://github.com/Itsusinn/slint-clash"

[dependencies]
slint = { version = "1.16.1", features = ["renderer-skia", "compat-1-2"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["tracing-log", "std", "local-time", "fmt", "ansi"] }
time = { version = "0.3", features = ["macros", "local-offset"] }
eyre = "0.6"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
